---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: '{{ source_url }}/-/tree/{{ revision }}'
    build.appstudio.redhat.com/commit_sha: '{{ revision }}'
    build.appstudio.redhat.com/target_branch: '{{ target_branch }}'
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "push" && target_branch == "push-rpms-to-pulp-f4730d33"
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: push-rpms-app-f4730d33
    appstudio.openshift.io/component: push-rpms-to-pulp-f4730d33
    pipelines.appstudio.openshift.io/type: build
  name: push-rpms-to-pulp-f4730d33-on-push
  namespace: dev-release-team-tenant
spec:
  params:
    - name: ociStorage
      value: quay.io/redhat-user-workloads-stage/dev-release-team-tenant/push-rpms-to-pulp-f4730d33:{{revision}}
    - name: package-name
      value: hello
    - name: git-url
      value: "{{ source_url }}"
    - name: revision
      value: "{{ revision }}"
    - name: target-branch
      value: "{{ target_branch }}"
    - name: build-architectures
      value: ["x86_64", "aarch64", "s390x", "ppc64le"]
    - name: build-platforms
      value: ["linux/amd64", "linux/arm64", "linux/s390x", "linux/ppc64le", "localhost"]
  pipelineRef:
    resolver: git
    params:
      - name: url
        value: "https://github.com/konflux-ci/rpmbuild-pipeline.git"
      - name: revision
        value: main
      - name: pathInRepo
        value: pipeline/build-rpm-package.yaml
  taskRunTemplate:
    serviceAccountName: build-pipeline-push-rpms-to-pulp-f4730d33
  workspaces:
    - name: git-auth
      secret:
        secretName: '{{ git_auth_secret }}'
